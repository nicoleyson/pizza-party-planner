# Runs every test, then publishes the site to GitHub Pages, on every push to main.
# If any test fails, nothing is published and the live site stays as it was.
# Pushes to claude/ working branches run the tests only, so they can be checked before main.
# config.js isn't in the repo: it's built here from four repo secrets
# (Settings → Secrets and variables → Actions → New repository secret):
#   FIREBASE_API_KEY, FIREBASE_APP_ID, FIREBASE_PROJECT_ID, FIREBASE_DATABASE_URL
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A newer push replaces an older run, but a branch's tests never cancel a deploy from main
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # The database rules emulator runs on Java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Unit tests
        run: npm test

      - name: Database rules (Firebase emulator, never the live database)
        run: npm run test:rules
        env:
          REQUIRE_EMULATOR: "1"

      - name: The page in a hidden Chrome (demo mode)
        run: npm run test:e2e

  build:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Write config.js from secrets
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
        run: |
          node -e '
            const e = process.env;
            const need = ["FIREBASE_API_KEY", "FIREBASE_APP_ID", "FIREBASE_PROJECT_ID", "FIREBASE_DATABASE_URL"];
            const missing = need.filter((k) => !e[k]);
            if (missing.length) { console.error("Missing repo secrets: " + missing.join(", ")); process.exit(1); }
            const config = {
              apiKey: e.FIREBASE_API_KEY.trim(),
              authDomain: e.FIREBASE_PROJECT_ID.trim() + ".firebaseapp.com",
              projectId: e.FIREBASE_PROJECT_ID.trim(),
              databaseURL: e.FIREBASE_DATABASE_URL.trim(),
              appId: e.FIREBASE_APP_ID.trim(),
            };
            require("fs").writeFileSync("config.js", "export const firebaseConfig = " + JSON.stringify(config, null, 2) + ";\n");
          '

      - name: Collect site files
        run: |
          mkdir _site
          cp index.html app.js lib.js pie.js morph.js night.js theme.js style.css config.js config.example.js _site/
          # Stamp this version on the page's links so browsers never mix old and new files
          v="${GITHUB_SHA::8}"
          sed -i -E "s#(href|src)=\"(style\.css|app\.js|theme\.js)\"#\1=\"\2?v=$v\"#g" _site/index.html
          grep -q "style.css?v=$v" _site/index.html
          # ...and on the files app.js imports, so a cached old lib.js never meets a new app.js
          sed -i -E "s#\"\./(lib|pie|morph|night|config|config\.example)\.js\"#\"./\1.js?v=$v\"#g" _site/app.js _site/night.js
          grep -q "lib.js?v=$v" _site/app.js && grep -q "config.js?v=$v" _site/app.js && grep -q "night.js?v=$v" _site/app.js && grep -q "lib.js?v=$v" _site/night.js

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
