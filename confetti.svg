<svg xmlns="http://www.w3.org/2000/svg" width="280" height="280" viewBox="0 0 280 280">
  <!-- One repeating tile of party confetti (style.css tiles it across the page). -->
  <g opacity=".8" stroke-linecap="round" stroke-linejoin="round">
    <!-- strips -->
    <rect x="24" y="30" width="18" height="7" rx="3.5" fill="#f7907e" transform="rotate(-28 33 33)"/>
    <rect x="150" y="18" width="16" height="6.5" rx="3.2" fill="#9fd3f0" transform="rotate(35 158 21)"/>
    <rect x="214" y="104" width="18" height="7" rx="3.5" fill="#ffd25e" transform="rotate(-62 223 107)"/>
    <rect x="92" y="148" width="17" height="6.5" rx="3.2" fill="#c7b3f5" transform="rotate(18 100 151)"/>
    <rect x="30" y="214" width="16" height="6.5" rx="3.2" fill="#8fcf7a" transform="rotate(55 38 217)"/>
    <rect x="186" y="226" width="18" height="7" rx="3.5" fill="#ff9fb5" transform="rotate(-12 195 229)"/>

    <!-- dots -->
    <circle cx="94" cy="44" r="4" fill="#ffd25e"/>
    <circle cx="246" cy="40" r="3.5" fill="#ff9fb5"/>
    <circle cx="136" cy="96" r="3" fill="#8fcf7a"/>
    <circle cx="58" cy="122" r="4" fill="#9fd3f0"/>
    <circle cx="258" cy="168" r="3.5" fill="#f7907e"/>
    <circle cx="150" cy="196" r="4" fill="#ffd25e"/>
    <circle cx="96" cy="252" r="3" fill="#c7b3f5"/>
    <circle cx="232" cy="268" r="3" fill="#9fd3f0"/>

    <!-- squiggles -->
    <path d="M196 60 q5 -7 10 0 t10 0" fill="none" stroke="#c7b3f5" stroke-width="3.2"/>
    <path d="M14 162 q5 -7 10 0 t10 0" fill="none" stroke="#f7907e" stroke-width="3.2"/>
    <path d="M118 222 q5 -7 10 0 t10 0" fill="none" stroke="#8fcf7a" stroke-width="3.2"/>

    <!-- triangles -->
    <path d="M178 150 l9 -3 l-4 9 z" fill="#ff9fb5"/>
    <path d="M64 82 l9 2 l-7 7 z" fill="#8fcf7a"/>
    <path d="M250 222 l8 4 l-8 5 z" fill="#ffd25e"/>
  </g>
</svg>
